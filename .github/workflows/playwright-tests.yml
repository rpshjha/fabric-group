name: Playwright E2E Tests CI/CD

permissions:
  checks: write
  contents: read

concurrency:
  group: playwright-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '30 2 * * *' # 8:00 AM IST (UTC+5:30)
  workflow_dispatch:
    inputs:
      browser:
        description: 'Browser to run tests'
        required: false
        default: 'chromium'

env:
  NODE_VERSION: '24'
  BROWSER: ${{ github.event.inputs.browser || 'chromium' }}
  BASE_URL: https://parabank.parasoft.com
  HEADLESS: 'true'
  TIMEOUT: '60000'
  EXPECT_TIMEOUT: '5000'
  CI: 'true'
  SMTP_HOST: ${{ secrets.SMTP_HOST }}
  SMTP_PORT: ${{ secrets.SMTP_PORT }}
  SMTP_USER: ${{ secrets.SMTP_USER }}
  SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
  EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
  EMAIL_TO: ${{ secrets.EMAIL_TO }}
  SEND_EMAIL_REPORT: true

jobs:
  test:
    name: Run Tests & Publish Artifact
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Check code formatting
        run: npm run format:check

      - name: Type checking
        run: npm run type-check

      - name: Install Playwright browsers
        run: npx playwright install --with-deps ${{ env.BROWSER }}

      - name: Run Playwright tests - ${{ env.BROWSER }}
        run: npx playwright test --project=${{ env.BROWSER }}
        continue-on-error: true

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: html-report-${{ env.BROWSER }}
          path: test-output/report/
          retention-days: 30

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts-${{ env.BROWSER }}
          path: |
            test-output/artifacts/
            test-output/results/
          retention-days: 30

      - name: Publish test results
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: test-output/results/junit.xml
          check_name: Test Results - ${{ env.BROWSER }}
          comment_mode: always
          compare_to_earlier_commit: true

  test-summary:
    name: Test Summary & Email Report
    runs-on: ubuntu-latest
    needs: test
    if: always()

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Download all test artifacts
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          path: test-artifacts

      - name: Install dependencies
        continue-on-error: true
        run: npm ci

      - name: Parse test results
        id: parse_results
        if: always()
        continue-on-error: true
        run: |
          # Parse results from all browsers
          TOTAL_TESTS=0
          TOTAL_PASSED=0
          TOTAL_FAILED=0
          TOTAL_SKIPPED=0          
          TOTAL_RETRIES=0
          FLAKY_TESTS=0
          RETRIED_TESTS=0
          RETRIED_TEST_NAMES=""

          for results_file in test-artifacts/test-artifacts-*/results/results.json; do
            if [ -f "$results_file" ]; then
              TESTS=$(jq '[.suites[].specs[].tests[]] | length' "$results_file" 2>/dev/null || echo "0")
              PASSED=$(jq '[.suites[].specs[].tests[] | select(.results[-1].status=="passed")] | length' "$results_file" 2>/dev/null || echo "0")
              FAILED=$(jq '[.suites[].specs[].tests[] | select(.results[-1].status=="failed")] | length' "$results_file" 2>/dev/null || echo "0")
              SKIPPED=$(jq '[.suites[].specs[].tests[] | select(.results[-1].status=="skipped")] | length' "$results_file" 2>/dev/null || echo "0")
              RETRIES=$(jq '[.suites[].specs[].tests[] | (.results | length - 1)] | add' "$results_file" 2>/dev/null || echo "0")
              FLAKY=$(jq '[.suites[].specs[].tests[] | select((.results | length > 1) and (.results[-1].status == "passed"))] | length' "$results_file" 2>/dev/null || echo "0")
              RETRIED=$(jq '[.suites[].specs[].tests[] | select(.results | length > 1)] | length' "$results_file" 2>/dev/null || echo "0")
              RETRIED_NAMES=$(jq -r '[.suites[].specs[] | select(.tests[].results | length > 1) | .title] | unique | join(", ")' "$results_file" 2>/dev/null || echo "")
              
              TOTAL_TESTS=$((TOTAL_TESTS + TESTS))
              TOTAL_PASSED=$((TOTAL_PASSED + PASSED))
              TOTAL_FAILED=$((TOTAL_FAILED + FAILED))
              TOTAL_SKIPPED=$((TOTAL_SKIPPED + SKIPPED))
              TOTAL_RETRIES=$((TOTAL_RETRIES + RETRIES))
              FLAKY_TESTS=$((FLAKY_TESTS + FLAKY))
              RETRIED_TESTS=$((RETRIED_TESTS + RETRIED))
              if [ -n "$RETRIED_NAMES" ]; then
                if [ -z "$RETRIED_TEST_NAMES" ]; then
                  RETRIED_TEST_NAMES="$RETRIED_NAMES"
                else
                  RETRIED_TEST_NAMES="$RETRIED_TEST_NAMES, $RETRIED_NAMES"
                fi
              fi
            fi
          done

          echo "total_tests=$TOTAL_TESTS" >> $GITHUB_OUTPUT
          echo "passed=$TOTAL_PASSED" >> $GITHUB_OUTPUT
          echo "failed=$TOTAL_FAILED" >> $GITHUB_OUTPUT
          echo "skipped=$TOTAL_SKIPPED" >> $GITHUB_OUTPUT
          echo "retries=$TOTAL_RETRIES" >> $GITHUB_OUTPUT
          echo "flaky=$FLAKY_TESTS" >> $GITHUB_OUTPUT
          echo "retried_tests=$RETRIED_TESTS" >> $GITHUB_OUTPUT
          echo "retried_test_names=$RETRIED_TEST_NAMES" >> $GITHUB_OUTPUT
          echo "pass_rate=$((TOTAL_PASSED * 100 / (TOTAL_TESTS > 0 ? TOTAL_TESTS : 1)))" >> $GITHUB_OUTPUT

      - name: Send test report email
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_HOST }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USER }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: |
            Playwright Report: ${{ steps.parse_results.outputs.passed || '0' }}/${{ steps.parse_results.outputs.total_tests || '0' }} Passed

          to: ${{ env.EMAIL_TO }}
          from: ${{ secrets.SMTP_USER }}
          priority: high

          attachments: |
            test-artifacts/**/*.json
            test-artifacts/**/*.xml
            test-artifacts/**/*.html
            test-artifacts/**/*.png
            test-artifacts/**/*.mp4
            test-artifacts/**/*.zip
            test-artifacts/**/*.webm
            test-artifacts/**/*.trace

          html_body: |
            <html>
            <body style="font-family: Arial, sans-serif; padding:20px; background-color:#f9f9f9; color:#333;">

              <h2 style="color:#2c3e50;">Playwright Test Report</h2>

              <table style="border-collapse: collapse; width: auto; min-width: 400px;">
                <tr>
                  <th style="border:1px solid #ddd; padding:8px;">Test Summary</th>
                  <th style="border:1px solid #ddd; padding:8px;">Result</th>
                </tr>
                <tr>
                  <td style="border:1px solid #ddd; padding:8px;">Total Tests</td>
                  <td style="border:1px solid #ddd; padding:8px;">${{ steps.parse_results.outputs.total_tests }}</td>
                </tr>
                <tr>
                  <td style="border:1px solid #ddd; padding:8px;">Tests Passed</td>
                  <td style="border:1px solid #ddd; padding:8px; color:green;">
                    ${{ steps.parse_results.outputs.passed }}
                  </td>
                </tr>
                <tr>
                  <td style="border:1px solid #ddd; padding:8px;">Tests Failed</td>
                  <td style="border:1px solid #ddd; padding:8px; color:red;">
                    ${{ steps.parse_results.outputs.failed }}
                  </td>
                </tr>
                <tr>
                  <td style="border:1px solid #ddd; padding:8px;">Total Retries</td>
                  <td style="border:1px solid #ddd; padding:8px;">
                    ${{ steps.parse_results.outputs.retries || '0' }}
                  </td>
                </tr>
                <tr>
                  <td style="border:1px solid #ddd; padding:8px;">Tests Retried</td>
                  <td style="border:1px solid #ddd; padding:8px;">
                    ${{ steps.parse_results.outputs.retried_tests || '0' }}
                  </td>
                </tr>
                <tr>
                  <td style="border:1px solid #ddd; padding:8px;">Retried Test Names</td>
                  <td style="border:1px solid #ddd; padding:8px;">
                    ${{ steps.parse_results.outputs.retried_test_names || 'None' }}
                  </td>
                </tr>
                <tr>
                  <td style="border:1px solid #ddd; padding:8px;">Pass Rate</td>
                  <td style="border:1px solid #ddd; padding:8px;">
                    ${{ steps.parse_results.outputs.pass_rate }}%
                  </td>
                </tr>
              </table>

              <br/>

              <h3 style="margin-top:20px;">Status:
                <span style="color:${{ (steps.parse_results.outputs.failed || '0') > 0 && 'red' || 'green' }}">
                  ${{ (steps.parse_results.outputs.failed || '0') > 0 && 'FAILED ❌' || 'PASSED ✅' }}
                </span>
              </h3>

              <p>
                🔗 <b>View Full Report:</b><br/>
                <a href="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}">
                  Open GitHub Run
                </a>
              </p>

              <hr/>

              <p style="font-size:12px; color:gray;">
                Repo: ${{ github.repository }} <br/>
                Branch: ${{ github.ref_name }} <br/>
                Trigger: ${{ github.event_name }}
              </p>

            </body>
            </html>
